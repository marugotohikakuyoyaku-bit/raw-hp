<main>

  <div class="page-header">
    <div class="container">
      <span class="eyebrow">Contact</span>
      <h1 class="reveal">お問い合わせ</h1>
      <p class="lead">ご質問・ご相談は、下記フォームよりお気軽にお送りください。</p>
    </div>
  </div>

  <section>
    <div class="container">
      <div class="text-block narrow">
        <form id="contact-form" class="contact-form" novalidate>

          <div class="form-field">
            <label for="name">お名前<span class="required">必須</span></label>
            <input type="text" id="name" name="name" autocomplete="name" required maxlength="100">
          </div>

          <div class="form-field">
            <label for="email">メールアドレス<span class="required">必須</span></label>
            <input type="email" id="email" name="email" autocomplete="email" required maxlength="200">
          </div>

          <div class="form-field">
            <label for="phone">電話番号</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" maxlength="20">
          </div>

          <div class="form-field">
            <label for="message">お問い合わせ内容<span class="required">必須</span></label>
            <textarea id="message" name="message" rows="7" required maxlength="4000"></textarea>
          </div>

          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>

          <button type="submit" class="form-submit" id="form-submit">送信する</button>

        </form>
      </div>
    </div>
  </section>

</main>

<script src="js/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var form = document.getElementById("contact-form");
  var status = document.getElementById("form-status");
  var submit = document.getElementById("form-submit");
  if (!form) return;

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    var name = form.name.value.trim();
    var email = form.email.value.trim();
    var phone = form.phone.value.trim();
    var message = form.message.value.trim();

    if (!name || !email || !message) {
      status.textContent = "すべての項目を入力してください。";
      status.className = "form-status is-error";
      return;
    }

    submit.disabled = true;
    submit.textContent = "送信中…";
    status.textContent = "";
    status.className = "form-status";

    fetch("/api/contact", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, email: email, phone: phone, message: message })
    })
      .then(function (res) {
        if (!res.ok) throw new Error("送信に失敗しました");
        return res.json();
      })
      .then(function () {
        status.textContent = "お問い合わせを送信しました。ご連絡までしばらくお待ちください。";
        status.className = "form-status is-success";
        form.reset();
      })
      .catch(function () {
        status.textContent = "送信に失敗しました。時間をおいて再度お試しください。";
        status.className = "form-status is-error";
      })
      .finally(function () {
        submit.disabled = false;
        submit.textContent = "送信する";
      });
  });
});
</script>
</body>
